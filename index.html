<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <div class="count">Count:<span id="countValue">0</span></div>

      <button class="primary-button" id="increaseButton" type="button">Increase</button>

      <div class="actions" aria-label="Button styles">
        <button class="action delete" type="button" id="deleteButton">Delete</button>
        <button class="action outline" type="button" id="outlineButton">Outline</button>
        <button class="action secondary" type="button" id="secondaryButton">secondary</button>
        <button class="action ghost" type="button" id="ghostButton">Ghost</button>
      </div>

      <div class="content">
        <p>This is test</p>
        <p>Students</p>
        <p>I am user and age is <span id="age">20</span></p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
